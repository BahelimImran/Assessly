services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://assessly:assessly@postgres:5432/assessly}
      AUTO_CREATE_DB_TABLES: ${AUTO_CREATE_DB_TABLES:-true}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-assessly}
      POSTGRES_USER: ${POSTGRES_USER:-assessly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessly}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      MODEL_REQUEST_RETRIES: ${MODEL_REQUEST_RETRIES:-2}
      MODEL_REQUEST_BACKOFF_SECONDS: ${MODEL_REQUEST_BACKOFF_SECONDS:-1.0}
      LLM_CONCURRENCY_LIMIT: ${LLM_CONCURRENCY_LIMIT:-1}
      LLM_CONCURRENCY_TTL_SECONDS: ${LLM_CONCURRENCY_TTL_SECONDS:-900}
      QUERY_JOB_TTL_SECONDS: ${QUERY_JOB_TTL_SECONDS:-86400}
      QUERY_STREAM_RECLAIM_IDLE_MS: ${QUERY_STREAM_RECLAIM_IDLE_MS:-3600000}
      QUERY_STREAM_BLOCK_MS: ${QUERY_STREAM_BLOCK_MS:-5000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEMO_USER_ID: ${DEMO_USER_ID:-demo_user}
      EMBED_REQUEST_TIMEOUT_SECONDS: ${EMBED_REQUEST_TIMEOUT_SECONDS:-120}
      EMBED_BATCH_REQUEST_TIMEOUT_SECONDS: ${EMBED_BATCH_REQUEST_TIMEOUT_SECONDS:-300}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-300}
      VISION_REQUEST_TIMEOUT_SECONDS: ${VISION_REQUEST_TIMEOUT_SECONDS:-180}
      UPLOAD_DIR: /app/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  query_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.query_worker
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://assessly:assessly@postgres:5432/assessly}
      AUTO_CREATE_DB_TABLES: ${AUTO_CREATE_DB_TABLES:-true}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-assessly}
      POSTGRES_USER: ${POSTGRES_USER:-assessly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessly}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      MODEL_REQUEST_RETRIES: ${MODEL_REQUEST_RETRIES:-2}
      MODEL_REQUEST_BACKOFF_SECONDS: ${MODEL_REQUEST_BACKOFF_SECONDS:-1.0}
      LLM_CONCURRENCY_LIMIT: ${LLM_CONCURRENCY_LIMIT:-3}
      LLM_CONCURRENCY_TTL_SECONDS: ${LLM_CONCURRENCY_TTL_SECONDS:-900}
      QUERY_JOB_TTL_SECONDS: ${QUERY_JOB_TTL_SECONDS:-86400}
      QUERY_STREAM_RECLAIM_IDLE_MS: ${QUERY_STREAM_RECLAIM_IDLE_MS:-3600000}
      QUERY_STREAM_BLOCK_MS: ${QUERY_STREAM_BLOCK_MS:-5000}
      EMBED_REQUEST_TIMEOUT_SECONDS: ${EMBED_REQUEST_TIMEOUT_SECONDS:-120}
      EMBED_BATCH_REQUEST_TIMEOUT_SECONDS: ${EMBED_BATCH_REQUEST_TIMEOUT_SECONDS:-300}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-300}
      VISION_REQUEST_TIMEOUT_SECONDS: ${VISION_REQUEST_TIMEOUT_SECONDS:-180}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT_PUBLISHED:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessly}
      POSTGRES_USER: ${POSTGRES_USER:-assessly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessly}
    ports:
      - "${POSTGRES_PORT_PUBLISHED:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  qdrant_storage:
  postgres_data:
