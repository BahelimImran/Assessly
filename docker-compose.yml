version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports: 
      - "4200:4200"
  
  qdrant:
  image: qdrant/qdrant:v1.14.1
  container_name: assessly-qdrant

  ports:
    - "6333:6333"

  volumes:
    - ./qdrant_storage:/qdrant/storage

  restart: unless-stopped